version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: summit_time_db
    environment:
      POSTGRES_USER: summituser
      POSTGRES_PASSWORD: summitpass
      POSTGRES_DB: summit_time
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summituser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - summit_time_network

  # Rust Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: summit_time_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://summituser:summitpass@postgres:5432/summit_time
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      RUST_LOG: info
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - summit_time_network

  # Frontend
  frontend:
    image: node:18-alpine
    container_name: summit_time_web
    ports:
      - "3000:3000"
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    networks:
      - summit_time_network

volumes:
  postgres_data:
    driver: local

networks:
  summit_time_network:
    driver: bridge
