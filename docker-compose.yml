version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: summit_time_db
    environment:
      POSTGRES_USER: summituser
      POSTGRES_PASSWORD: summitpass
      POSTGRES_DB: summit_time
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summituser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: summit_time_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://summituser:summitpass@postgres:5432/summit_time
      JWT_SECRET: dev_secret_key_change_in_production
      RUST_LOG: info
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: cargo watch -x run

  # Frontend (optional - for dev, usually run separately)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: summit_time_web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: summit_time_network
