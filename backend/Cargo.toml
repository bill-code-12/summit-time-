[package]
name = "summit-time"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "summit-time"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-rt = "2"
actix-ws = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-postgres = "0.7"
deadpool-postgres = "0.13"
jwt = "0.16"
shared_secret = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
cors = "0.4"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
async-trait = "0.1"
rand = "0.8"
